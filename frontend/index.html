<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RingWatch — Explainable detection and investigation of coordinated refund abuse rings." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RingWatch</title>
    <script>
      // Apply the persisted theme before paint (dark by default) to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (t === null && true)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
