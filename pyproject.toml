    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-louvain>=0.16",
    "razorpay>=2.0.1",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "torch>=2.13.0",
    "torch-geometric>=2.8.0.post1",
